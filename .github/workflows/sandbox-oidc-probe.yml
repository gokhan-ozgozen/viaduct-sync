name: Sandbox OIDC Probe

# Compares what a job can do with `id-token: write` versus `id-token: none`.
# The `id-token: read` case lives in sandbox-oidc-probe-read.yml so that, if GitHub
# rejects that value, it doesn't take these jobs down with it.
on:
  push:
    branches: [gokhanozg--ci-artifactory]
    paths:
      - .github/workflows/sandbox-oidc-probe*.yml
      - .github/scripts/probe-oidc.sh
      - .github/scripts/configure-dependency-mirror.sh
  workflow_dispatch:

env:
  VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN: ${{ vars.VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN }}

jobs:
  id-token-write:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/probe-oidc.sh write

  id-token-none:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/probe-oidc.sh none
