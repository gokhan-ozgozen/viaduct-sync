name: Sandbox OIDC Probe

# Compares what a job can do with `id-token: write` versus `id-token: none`.
# The `id-token: read` case lives in sandbox-oidc-probe-read.yml so that, if GitHub
# rejects that value, it doesn't take these jobs down with it.
on:
  push:
    branches: [gokhanozg--ci-artifactory]
    paths:
      - .github/workflows/sandbox-oidc-probe*.yml
      - .github/scripts/probe-oidc.sh
      - .github/scripts/configure-dependency-mirror.sh
  workflow_dispatch:

env:
  VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN: ${{ vars.VIADUCT_DEPENDENCY_MIRROR_ROLE_ARN }}

jobs:
  id-token-write:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/probe-oidc.sh write
      # TEMPORARY: mints two tokens and prints their hashes and claims, never the tokens.
      - name: Compare minted tokens
        shell: bash
        run: |
          for i in 1 2; do
            jwt="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
            echo "::add-mask::${jwt}"
            payload="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')"
            while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
            echo "token $i sha256=$(printf '%s' "$jwt" | sha256sum | cut -c1-64)"
            printf '%s' "$payload" | base64 -d \
              | jq -c '{jti, iat, nbf, exp, run_id, run_attempt, sha, sub, aud}' | sed "s/^/token $i claims=/"
            sleep 2
          done

  id-token-none:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/probe-oidc.sh none
